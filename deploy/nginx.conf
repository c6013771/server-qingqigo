user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ===== 前端：HTTP 全部跳转 HTTPS =====
  server {
    listen 80;
    server_name qingqier.com www.qingqier.com;
    return 301 https://$host$request_uri;
  }

  # ===== 前端静态站点（HTTPS） =====
  server {
    listen 443 ssl;
    http2 on;
    server_name qingqier.com www.qingqier.com;

    ssl_certificate     /etc/nginx/ssl/qingqier.com.crt;
    ssl_certificate_key /etc/nginx/ssl/qingqier.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 缓存策略（配合 Astro 打包产物）：
    #   /_astro/  文件名带内容 hash，一年长缓存 + immutable，发版自动换新 URL
    #   图片/图标/txt/xml  文件名不带 hash，缓存 7 天
    #   HTML      no-cache，每次回源校验（内容没变返回 304），保证发版后立即生效

    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|svg|jpg|jpeg|webp|gif|woff2?|txt|xml)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      # Astro 输出的是 /privacy/index.html 形式的静态页
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
    }
  }

  # ===== API：HTTP 全部跳转 HTTPS =====
  server {
    listen 80;
    server_name api.qingqier.com;
    return 301 https://$host$request_uri;
  }

  # ===== 后端 API 反向代理（HTTPS） =====
  server {
    listen 443 ssl;
    http2 on;
    server_name api.qingqier.com;

    ssl_certificate     /etc/nginx/ssl/api.qingqier.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.qingqier.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
      proxy_pass http://server:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # 后端限流依赖 X-Forwarded-For 取真实客户端 IP，必须透传
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
