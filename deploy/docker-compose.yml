# 生产环境编排：MySQL + Redis + 后端 + Nginx（前端静态文件由 Nginx 直接托管）
# 使用方法：cp .env.example .env 并填写密码后，docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: qingqigo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: qingqigo
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app
    # 注意：不映射端口到宿主机，MySQL 只在容器网络内可访问，避免暴露公网

  redis:
    image: redis:7
    container_name: qingqigo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app

  server:
    build:
      # 默认 .. 适用于仓库内使用（deploy/ 上一级即项目根目录）；
      # 服务器上 compose 文件在独立编排目录，由部署脚本注入 SERVER_BUILD_CONTEXT 指向后端仓库
      context: ${SERVER_BUILD_CONTEXT:-..}
    container_name: qingqigo-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mysql
      - redis
    volumes:
      # 站点图标落盘目录持久化，避免容器重建丢图
      - ./icons:/app/storage/icons
      # 用户头像落盘目录持久化（微信头像转存）
      - ./avatars:/app/storage/avatars
    ports:
      - "127.0.0.1:3000:3000"   # 只绑定本机回环，公网流量由 Nginx 反代进入
    networks:
      - app

  nginx:
    image: nginx:alpine
    container_name: qingqigo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # host.docker.internal 指向宿主机：本地开发联调时，nginx 通过它访问宿主机的 SSH 隧道端口
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-dist:/usr/share/nginx/html:ro   # 前端构建产物（web-qingqigo 的 dist）
      - ./ssl:/etc/nginx/ssl:ro               # HTTPS 证书（可选，见部署教程）
    depends_on:
      - server
    networks:
      - app

networks:
  app:

volumes:
  mysql-data:
  redis-data:
