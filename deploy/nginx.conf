user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ===== 前端静态站点 =====
  server {
    listen 80;
    server_name qingqier.com www.qingqier.com;

    # 配置 HTTPS 后开启：HTTP 全部跳转 HTTPS
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      # Astro 输出的是 /privacy/index.html 形式的静态页
      try_files $uri $uri/index.html =404;
    }

    # Astro 构建产物带内容 hash，可放心长缓存
    location /_astro/ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }

  # ===== 后端 API 反向代理 =====
  server {
    listen 80;
    server_name api.qingqier.com;

    location / {
      proxy_pass http://server:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # 后端限流依赖 X-Forwarded-For 取真实客户端 IP，必须透传
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ===== HTTPS（申请到证书后，把上面两个 80 端口 server 块替换为以下配置）=====
