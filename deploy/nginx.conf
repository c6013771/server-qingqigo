user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ==========================================
  # 1. 根域名 qingqier.com (不走 EdgeOne，直接连服务器)
  # ==========================================
  
  # 1.1 HTTP 请求 -> 跳转到 www 的 HTTPS
  server {
    listen 80;
    server_name qingqier.com;
    return 301 https://www.qingqier.com$request_uri;
  }

  # 1.2 HTTPS 请求 -> 用旧证书 -> 跳转到 www 的 HTTPS
  # (解决你刚才访问 https://qingqier.com 报错的问题)
  server {
    listen 443 ssl;
    server_name qingqier.com;

    # 使用你服务器上原有的证书 (截图显示还没过期，到 2026-12-17)
    ssl_certificate     /etc/nginx/ssl/qingqier.com.crt;
    ssl_certificate_key /etc/nginx/ssl/qingqier.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 收到请求后，直接 301 跳转到 www 域名 (让 EdgeOne 去处理)
    return 301 https://www.qingqier.com$request_uri;
  }

  # ==========================================
  # 2. www 域名 (走 EdgeOne，服务器只开 HTTP 80 端口)
  # ==========================================
  server {
    listen 80;
    server_name www.qingqier.com;

    root /usr/share/nginx/html;
    index index.html;

    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|svg|jpg|jpeg|webp|gif|woff2?|txt|xml)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
    }
  }

  # ==========================================
  # 3. API 域名 (走 EdgeOne，服务器只开 HTTP 80 端口)
  # ==========================================
  server {
    listen 80;
    server_name api.qingqier.com;

    location / {
      proxy_pass http://qingqigo-server:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ==========================================
  # 4. 本地开发联调域名 (走 EdgeOne，服务器 80 → 宿主机 7300 SSH 隧道 → 本地 3000)
  # ==========================================
  server {
    listen 80;
    server_name dev-api.qingqier.com;

    location / {
      proxy_pass http://host.docker.internal:7300;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 扫码回调链路较长，放宽读超时
      proxy_read_timeout 60s;
    }
  }
}
