user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ==========================================
  # 1. 根域名 qingqier.com
  #    不走 EdgeOne，直接连接服务器
  # ==========================================

  # 1.1 HTTP -> www HTTPS
  server {
    listen 80;
    server_name qingqier.com;

    return 301 https://www.qingqier.com$request_uri;
  }

  # 1.2 HTTPS -> www HTTPS
  server {
    listen 443 ssl;
    server_name qingqier.com;

    ssl_certificate     /etc/nginx/ssl/qingqier.com.crt;
    ssl_certificate_key /etc/nginx/ssl/qingqier.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.qingqier.com$request_uri;
  }


  # ==========================================
  # 2. www 域名
  #    走 EdgeOne
  #    服务器只提供 HTTP 80
  # ==========================================

  server {
    listen 80;
    server_name www.qingqier.com;

    root /usr/share/nginx/html;
    index index.html;

    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|svg|jpg|jpeg|webp|gif|woff2?|txt|xml)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
    }
  }


  # ==========================================
  # 3. API 域名
  #    走 EdgeOne
  #    服务器只提供 HTTP 80
  # ==========================================

  server {
    listen 80;
    server_name api.qingqier.com;

    location / {
      proxy_pass http://qingqigo-server:3000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }


  # ==========================================
  # 4. Adminer 数据库管理
  #
  #    dbadmin.qingqier.com
  #
  #    HTTPS
  #      ↓
  #    IP 白名单
  #      ↓
  #    Adminer
  #      ↓
  #    MySQL
  #
  #    注意：
  #    Adminer 不直接暴露 8080
  # ==========================================

  # 4.1 HTTP -> HTTPS
  server {
    listen 80;
    server_name dbadmin.qingqier.com;

    return 301 https://dbadmin.qingqier.com$request_uri;
  }


  # 4.2 HTTPS -> Adminer
  server {
    listen 443 ssl;
    server_name dbadmin.qingqier.com;

    ssl_certificate     /etc/nginx/ssl/dbadmin.qingqier.com.crt;
    ssl_certificate_key /etc/nginx/ssl/dbadmin.qingqier.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ==========================================
    # IP 白名单
    #
    # 把下面的 YOUR_PUBLIC_IP
    # 替换成你自己的公网 IP
    #
    # 例如：
    # allow 1.2.3.4;
    # ==========================================

    allow 45.43.60.174;
    deny all;

    location / {
      proxy_pass http://qingqigo-adminer:8080;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
