user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ===== 前端静态站点（HTTP）=====
  server {
    listen 80;
    server_name qingqier.com www.qingqier.com;

    root /usr/share/nginx/html;
    index index.html;

    # 缓存策略：
    #   /_astro/  文件名带内容 hash，一年长缓存 + immutable
    #   图片/图标/txt/xml  缓存 7 天
    #   HTML      no-cache，每次回源校验

    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|svg|jpg|jpeg|webp|gif|woff2?|txt|xml)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      # Astro 输出的是 /privacy/index.html 形式的静态页
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
    }
  }

  # ===== 后端 API（HTTP）=====
  server {
    listen 80;
    server_name api.qingqier.com;

    location / {
      proxy_pass http://server:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # 后端限流依赖 X-Forwarded-For 取真实客户端 IP，必须透传
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}